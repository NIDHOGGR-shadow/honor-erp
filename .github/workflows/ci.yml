name: Honor checks
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/prepare-cloudflare.mjs
      - run: npm run build:storefront
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: honor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/backend
    env:
      HONOR_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-test-password@localhost:5432/honor_test
      HONOR_ALLOW_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check honor tests
      - run: uv run pytest -q
