# Free pilot: one API service only. No paid worker, cron, database or disk.
# Keep the existing Honor secrets; provide values privately during setup.
previews:
  generation: "off"

services:
  - type: web
    name: honor-api
    runtime: docker
    repo: https://github.com/NIDHOGGR-shadow/honor-erp
    branch: main
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HONOR_ENVIRONMENT
        value: production
      - key: HONOR_AUTH_PROVIDER
        value: supabase
      - key: HONOR_COOKIE_SECURE
        value: "true"
      - key: HONOR_PAYMENT_PROVIDER
        value: disabled
      - key: HONOR_SESSION_SECRET
        sync: false
      - key: HONOR_DATABASE_URL
        sync: false
      - key: HONOR_SUPABASE_URL
        sync: false
      - key: HONOR_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: HONOR_APP_ORIGIN
        sync: false
      - key: HONOR_SHOP_ORIGIN
        sync: false
      - key: HONOR_ALLOWED_ORIGINS
        sync: false
