services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/configure_dev.py}
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/configure_dev.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_dev.py}
    volumes:
      - honor-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: [".venv/bin/python", "-m", "honor.jobs"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  honor-dev-postgres:
